# Gazebo x500 / PX4 rate-loop tuning. Not validated for real hardware.
# Paired with px4_bridge hover_thrust=0.728744 and max_throttle=0.9.
ommpc_node:
  ros__parameters:
    horizon: 30
    dt: 0.02
    state_weights: [30.0, 30.0, 60.0, 20.0, 20.0, 30.0, 80.0, 80.0, 40.0]
    terminal_weights: [60.0, 60.0, 120.0, 40.0, 40.0, 60.0, 160.0, 160.0, 80.0]
    input_weights: [4.0, 20.0, 20.0, 5.0]
    input_min: [1.0, -3.0, -3.0, -1.5]
    input_max: [12.0, 3.0, 3.0, 1.5]
